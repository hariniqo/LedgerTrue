name: Anchor mirror
# Copies the app's signed anchor log into this repo every 15 minutes. If the operator ever rewrites history, this job fails.
# Set the repository variable ANCHOR_URL to your deployed app, e.g. https://ledgertrue.onrender.com
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    if: ${{ vars.ANCHOR_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/anchor-mirror.mjs "${{ vars.ANCHOR_URL }}" mirror/anchors.json
      - name: Commit new anchors
        run: |
          git config user.name "anchor-mirror"; git config user.email "anchor-mirror@users.noreply.github.com"
          git add mirror/anchors.json
          if git diff --cached --quiet; then
            echo "No new anchors."
          else
            git commit -m "Mirror anchors"
            git push
          fi
